name: Badge

# 把 CI 状态输出成 SVG，放到 main 分支的 .ci-status/badge.svg，
# 这样任何人（无需登录）都能通过 raw / 静态托管拿到一个实时状态徽章。
# 注意：这里只写状态徽章，不涉及任何部署动作。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badge
  cancel-in-progress: true

jobs:
  update:
    name: 更新状态徽章
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          ref: main

      - name: 生成徽章
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          case "${CONCLUSION:-unknown}" in
            success) color="#2ea44f"; label="passing" ;;
            failure) color="#cf222e"; label="failing" ;;
            cancelled) color="#9a6700"; label="cancelled" ;;
            *) color="#6e7781"; label="unknown" ;;
          esac
          mkdir -p .ci-status
          cat > .ci-status/badge.svg <<SVG
          <svg xmlns="http://www.w3.org/2000/svg" width="200" height="24" role="img" aria-label="CI ${label}">
            <title>CI ${label}</title>
            <g font-family="Verdana,DejaVu Sans,sans-serif" font-size="11" text-anchor="middle">
              <rect width="92" height="24" fill="#555"/>
              <rect x="92" width="108" height="24" fill="${color}"/>
              <text x="46" y="16" fill="#fff">build</text>
              <text x="146" y="16" fill="#fff">${label}</text>
            </g>
          </svg>
          SVG
          cat > .ci-status/status.json <<JSON
          {
            "conclusion": "${CONCLUSION:-unknown}",
            "runNumber": ${RUN_NUMBER:-0},
            "runUrl": "${RUN_URL}",
            "commit": "${HEAD_SHA}",
            "updatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

      - name: 提交徽章
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- .ci-status; then
            echo "状态未变化，跳过提交。"
            exit 0
          fi
          git add .ci-status
          git commit -m "chore(badge): CI ${CONCLUSION:-unknown} (run ${RUN_NUMBER:-0})"
          git push
