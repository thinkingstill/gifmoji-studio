name: CI

# 只做校验，不做部署：本仓库刻意不包含 WorkBuddy 托管产物与任何密钥。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} 冒烟测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 FFmpeg
        # Ubuntu 26.04 的 ffmpeg 会拉 80+ 个依赖包，install 需要 2 分钟上下。
        # 用 Acquire 超时让单个慢源 10 秒内快速失败（update 秒过），
        # 而 install 给足 300 秒，避免被 timeout 反复杀掉后重试、白等。
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            export APT_OPTS="-o Acquire::Retries=2 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 -o Acquire::ftp::Timeout=10"
            for attempt in 1 2 3; do
              if timeout 90 sudo apt-get $APT_OPTS update \
                && timeout 300 sudo apt-get $APT_OPTS install -y --no-install-recommends ffmpeg; then
                break
              fi
              echo "::warning::FFmpeg 安装第 ${attempt} 次失败，重试中…"
              sleep 5
            done
          fi
          ffmpeg -version | head -n 1

      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 依赖漏洞审计
        run: npm run audit

      - name: 语法检查
        run: |
          node --check server.js
          node --check public/app.js
          node --check public/giflite.js
          node --check public/directgen.js
          node --check public/backend.js
          node --check scripts/sync-docs.mjs
          node --check test/smoke.mjs
          node --check test/remote-image.test.mjs

      - name: docs/ 与 public/ 必须同步
        run: |
          node scripts/sync-docs.mjs
          if [ -n "$(git status --porcelain -- docs)" ]; then
            echo "::error::docs/ 与 public/ 不同步，请在本地执行 npm run sync:docs 后提交"
            git --no-pager diff --stat -- docs
            exit 1
          fi

      - name: 前端编码器单元测试（方案 C：量化 / 抖动 / LZW / ZIP）
        run: npm run test:unit

      - name: 链接导入测试（SSRF 拦截 / 大小与类型校验 / 重定向拒绝）
        run: npm run test:remote

      - name: 冒烟测试（上传分镜 → FFmpeg 合成 GIF → 下载校验）
        run: npm test

  secret-scan:
    name: 密钥与产物扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 历史提交中不得出现密钥或部署标识
        env:
          # 前缀拆开拼接、正则运行时组装，避免本文件自身成为误报来源；
          # 这里只用纯字母数字标记，避免与"密钥前缀"同名。
          PART_ONE: 'github'
          PART_TWO: '_pat_'
          PART_THREE: 'ghp'
          PART_FOUR: 'sk'
          AK_LABEL: 'AKID'
        run: |
          set -euo pipefail
          pattern="${PART_ONE}${PART_TWO}[A-Za-z0-9_]{20,}|${PART_THREE}_[A-Za-z0-9]{20,}|${PART_FOUR}-[A-Za-z0-9]{20,}|${AK_LABEL}[A-Za-z0-9]{10,}"
          pattern="${pattern}|share""code=|workbuddy\.host"
          # 排除本工作流文件，其中的检测规则属于定义而非泄露
          hits=$(git log -p --all -- . ":(exclude).github/workflows/ci.yml" | grep -nEI "$pattern" || true)
          if [ -n "$hits" ]; then
            echo "命中行数：$(echo "$hits" | wc -l)"
            echo "$hits" | sed -E 's/([A-Za-z0-9_]{6})[A-Za-z0-9_]{10,}/\1***/g' | head -n 20
            echo "::error::检测到疑似密钥或 WorkBuddy 部署标识，请立即吊销并清理提交历史。"
            exit 1
          fi
          if git ls-files | grep -E '^(\.env(\..*)?|node_modules/|dist/|data/)' ; then
            echo "::error::仓库中不应包含环境变量文件、依赖或构建产物。"
            exit 1
          fi
          echo "扫描通过：未发现密钥、环境变量文件或构建产物。"

  ci-status:
    name: CI 汇总
    runs-on: ubuntu-latest
    needs: [test, secret-scan]
    if: always()
    steps:
      - name: 汇总结果
        run: |
          echo "测试：${{ needs.test.result }} / 扫描：${{ needs.secret-scan.result }}"
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.secret-scan.result }}" != "success" ]; then
            exit 1
          fi
